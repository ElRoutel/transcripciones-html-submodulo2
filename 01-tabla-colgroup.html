<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla con colgroup / col</title>
</head>
<body>

<table>
  <caption>Reporte de Ventas Trimestral</caption>
  <colgroup>
    <col style="background-color: #f2f2f2;">
    <col span="2">
  </colgroup>
  <thead>
    <tr>
      <th scope="col">Región</th>
      <th scope="col">Q1</th>
      <th scope="col">Q2</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">Norte</th>
      <td>$10,000</td>
      <td>$12,500</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <th scope="row">Total</th>
      <td colspan="2">$22,500</td>
    </tr>
  </tfoot>
</table>

</body>
</html>
