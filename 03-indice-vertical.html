<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Índice Vertical Interactivo</title>
  <style>
    .indice-vertical {
      width: 280px;
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 15px;
      font-family: system-ui, sans-serif;
    }

    .indice-vertical h2 {
      font-size: 1.1rem;
      color: #212529;
      margin-top: 0;
      border-bottom: 2px solid #0d6efd;
      padding-bottom: 8px;
    }

    .indice-vertical ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .indice-vertical li {
      margin-bottom: 8px;
    }

    .indice-vertical a {
      display: block;
      padding: 8px 12px;
      color: #0d6efd;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.2s, color 0.2s;
    }

    .indice-vertical a:hover {
      background-color: #e9ecef;
      color: #0a58ca;
    }
  </style>
</head>
<body>

  <nav class="indice-vertical" aria-label="Índice de navegación externa">
    <h2>Índice de Recursos</h2>
    <ul>
      <li>
        <a href="https://developer.mozilla.org/es/" target="_blank" rel="noopener noreferrer">
          MDN Web Docs (Documentación HTML)
        </a>
      </li>
      <li>
        <a href="https://www.w3.org/" target="_blank" rel="noopener noreferrer">
          W3C (Estándares Web)
        </a>
      </li>
      <li>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer">
          GitHub (Repositorio de Código)
        </a>
      </li>
      <li>
        <a href="https://google.com" target="_blank" rel="noopener noreferrer">
          Google (Buscador)
        </a>
      </li>
    </ul>
  </nav>

</body>
</html>
